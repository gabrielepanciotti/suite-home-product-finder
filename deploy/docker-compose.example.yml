services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-homeproductfinder}
      POSTGRES_USER: ${DB_USER:-homeproductfinder}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-homeproductfinder} -d ${DB_NAME:-homeproductfinder}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
      target: prod
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-homeproductfinder}:${DB_PASSWORD:?set DB_PASSWORD in .env}@db:5432/${DB_NAME:-homeproductfinder}
    volumes:
      - ../vault:/app/vault
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-10008}:10008"

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      target: prod
    depends_on:
      - backend
    ports:
      - "3342:3342"

volumes:
  postgres-data:
